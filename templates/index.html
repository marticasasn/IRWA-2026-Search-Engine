{% extends "base.html" %}
{% block page_title %}{{ page_title }}{% endblock %}
{% block content %}
    <div class="centered">
        <p>&nbsp;</p>
        <p>&nbsp;</p>
        <p>&nbsp;</p>
        <form method="POST" action="/search">
            <div class="input-group">
                <input class="form-control" name="search-query" type="search" placeholder="Search fashion products"
                       aria-label="Search" autofocus="autofocus" required>
                <div class="input-group-append">
                    <button class="btn btn-primary" type="submit">Search</button>
                </div>
            </div>
            <div class="form-inline justify-content-center mt-3">
                <label class="mr-2" for="method">Ranking method</label>
                <select class="custom-select" id="method" name="method">
                    {% for value, label in methods.items() %}
                        <option value="{{ value }}" {% if value == selected_method %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="d-flex justify-content-center">{% include "_search_options.html" %}</div>
            <input name="upf-irwa-hidden" type="hidden" value="123">
        </form>
        <p>&nbsp;</p>
        <p>&nbsp;</p>
        <p>&nbsp;</p>
    </div>
{% endblock %}
